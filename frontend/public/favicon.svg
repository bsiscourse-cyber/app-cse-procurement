<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Soft Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Container (Modern App Icon Style) -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Document / Spreadsheet Icon Body -->
  <rect x="34" y="30" width="60" height="68" rx="8" fill="#ffffff" opacity="0.08"/>
  <rect x="34" y="30" width="60" height="68" rx="8" stroke="url(#accentGrad)" stroke-width="4" fill="none"/>

  <!-- Grid Rows / Columns (Spreadsheet Lines) -->
  <line x1="34" y1="48" x2="94" y2="48" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="0"/>
  <line x1="54" y1="48" x2="54" y2="98" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.7"/>
  <line x1="74" y1="48" x2="74" y2="98" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.7"/>

  <line x1="34" y1="65" x2="94" y2="65" stroke="#64748b" stroke-width="2" opacity="0.5"/>
  <line x1="34" y1="81" x2="94" y2="81" stroke="#64748b" stroke-width="2" opacity="0.5"/>

  <!-- Checkmark Badge (Approved / Verified Accent) -->
  <circle cx="88" cy="36" r="14" fill="#10b981" filter="url(#glow)"/>
  <path d="M81 36 L86 41 L95 31" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
